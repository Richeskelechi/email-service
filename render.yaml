# Render Blueprint — single web service (API + embedded outbox worker) + Postgres
# Dashboard: New → Blueprint → connect this repo → branch `staging`
# Later: set WORKER_EMBEDDED=false and add a Background Worker (`npm run start:worker`)

databases:
  - name: my-email-db
    plan: free
    databaseName: my_email
    user: my_email

services:
  - type: web
    name: my-email-api
    runtime: node
    plan: free
    region: oregon
    branch: staging
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: staging
      - key: WORKER_EMBEDDED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: my-email-db
          property: connectionString
      - key: DEV_API_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_DEFAULT
        value: noreply@citygroupsavings.com
      - key: PASSWORD_SETUP_TOKEN_TTL_HOURS
        value: "48"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: WORKER_POLL_MS
        value: "2000"
      - key: WORKER_BATCH_SIZE
        value: "20"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: WORKER_FANOUT_CHUNK
        value: "100"
      - key: BULK_MAX_RECIPIENTS
        value: "1000"
      - key: ORG_RATE_LIMIT_PER_MINUTE
        value: "120"
