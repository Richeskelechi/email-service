# Render Blueprint — API + outbox worker + Postgres
# Dashboard: New → Blueprint → connect this repo → branch `staging`
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: my-email-db
    plan: basic-256mb
    databaseName: my_email
    user: my_email

services:
  - type: web
    name: my-email-api
    runtime: node
    plan: starter
    region: oregon
    branch: staging
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: my-email-db
          property: connectionString
      - key: DEV_API_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_DEFAULT
        value: noreply@citygroupsavings.com
      - key: PASSWORD_SETUP_TOKEN_TTL_HOURS
        value: "48"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: WORKER_POLL_MS
        value: "2000"
      - key: WORKER_BATCH_SIZE
        value: "20"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: WORKER_FANOUT_CHUNK
        value: "100"
      - key: BULK_MAX_RECIPIENTS
        value: "1000"
      - key: ORG_RATE_LIMIT_PER_MINUTE
        value: "120"

  - type: worker
    name: my-email-worker
    runtime: node
    plan: starter
    region: oregon
    branch: staging
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: my-email-db
          property: connectionString
      - key: DEV_API_KEY
        fromService:
          name: my-email-api
          type: web
          envVarKey: DEV_API_KEY
      - key: RESEND_API_KEY
        fromService:
          name: my-email-api
          type: web
          envVarKey: RESEND_API_KEY
      - key: MAIL_FROM_DEFAULT
        fromService:
          name: my-email-api
          type: web
          envVarKey: MAIL_FROM_DEFAULT
      - key: PASSWORD_SETUP_TOKEN_TTL_HOURS
        fromService:
          name: my-email-api
          type: web
          envVarKey: PASSWORD_SETUP_TOKEN_TTL_HOURS
      - key: SESSION_TTL_DAYS
        fromService:
          name: my-email-api
          type: web
          envVarKey: SESSION_TTL_DAYS
      - key: WORKER_POLL_MS
        fromService:
          name: my-email-api
          type: web
          envVarKey: WORKER_POLL_MS
      - key: WORKER_BATCH_SIZE
        fromService:
          name: my-email-api
          type: web
          envVarKey: WORKER_BATCH_SIZE
      - key: WORKER_CONCURRENCY
        fromService:
          name: my-email-api
          type: web
          envVarKey: WORKER_CONCURRENCY
      - key: WORKER_FANOUT_CHUNK
        fromService:
          name: my-email-api
          type: web
          envVarKey: WORKER_FANOUT_CHUNK
      - key: BULK_MAX_RECIPIENTS
        fromService:
          name: my-email-api
          type: web
          envVarKey: BULK_MAX_RECIPIENTS
      - key: ORG_RATE_LIMIT_PER_MINUTE
        fromService:
          name: my-email-api
          type: web
          envVarKey: ORG_RATE_LIMIT_PER_MINUTE
